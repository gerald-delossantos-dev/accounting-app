[project]
name = "ledgerpro-api"
version = "0.1.0"
description = "FastAPI accounting SaaS backend"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic-settings>=2.7",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "python-multipart>=0.0.20",
  "celery>=5.4",
  "redis>=5.2",
  "structlog>=24.4",
  "slowapi>=0.1.9",
  "weasyprint>=63.0",
  "pytest>=8.3",
  "httpx>=0.28",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
